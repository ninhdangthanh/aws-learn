name: jaeger-lab

services:
  # ── Hạ tầng ────────────────────────────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: lab-jaeger
    environment:
      # Bắt buộc, nếu không cổng 4317 sẽ không mở và mọi service báo
      # "connection refused" khi đẩy span.
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI  → http://localhost:16686
      - "4317:4317"   # OTLP/gRPC (các service đẩy span vào đây)
      - "4318:4318"   # OTLP/HTTP (không dùng trong lab, mở sẵn để bạn thử)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    container_name: lab-postgres
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      # 5442 chứ không phải 5432: máy bạn đã có Postgres khác chiếm cổng chuẩn.
      # Bên trong mạng compose các service vẫn nối tới postgres:5432 như thường.
      - "5442:5432" # psql -h localhost -p 5442 -U lab -d lab
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lab-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab
    ports:
      # Dời khỏi 5672/15672 vì máy bạn đã có RabbitMQ khác đang chạy.
      - "5673:5672"   # AMQP
      - "15673:15672" # UI → http://localhost:15673 (lab / lab)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ── Service ứng dụng ───────────────────────────────────────────────────────
  #
  # Cả bốn dùng chung một Dockerfile, khác nhau ở build arg SERVICE.
  # Biến chung cho mọi service:
  #   OTEL_EXPORTER_OTLP_ENDPOINT — địa chỉ collector của Jaeger (không có scheme)

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    container_name: lab-gateway
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      HTTP_ADDR: ":8080"
      ORDER_ADDR: "order:9091"
    ports:
      - "8080:8080"
    depends_on:
      jaeger:
        condition: service_healthy
      order:
        condition: service_started
    restart: unless-stopped

  order:
    build:
      context: .
      args:
        SERVICE: order
    container_name: lab-order
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9091"
      INVENTORY_ADDR: "inventory:9092"
      DATABASE_URL: "postgres://lab:lab@postgres:5432/lab?sslmode=disable"
      RABBITMQ_URL: "amqp://lab:lab@rabbitmq:5672/"
    ports:
      - "9091:9091" # mở ra để bạn gọi thẳng bằng grpcurl, bỏ qua gateway
    depends_on:
      jaeger:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  inventory:
    build:
      context: .
      args:
        SERVICE: inventory
    container_name: lab-inventory
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      GRPC_ADDR: ":9092"
      DATABASE_URL: "postgres://lab:lab@postgres:5432/lab?sslmode=disable"
    ports:
      - "9092:9092"
    depends_on:
      jaeger:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # unless-stopped là CỐ Ý: kịch bản 04 làm service này panic và chết hẳn.
    # Docker sẽ dựng lại sau vài giây, để bạn thấy trace bị cụt rồi hệ thống tự hồi.
    restart: unless-stopped

  notification:
    build:
      context: .
      args:
        SERVICE: notification
    container_name: lab-notification
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      RABBITMQ_URL: "amqp://lab:lab@rabbitmq:5672/"
      GATEWAY_URL: "http://gateway:8080"
    depends_on:
      jaeger:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
